# Acopio + Caddy (HTTPS automático). Configuración en el archivo .env (ver .env.example)
services:
  acopio:
    build: .
    env_file: .env
    restart: unless-stopped
    # Solo accesible desde el propio servidor; hacia fuera sale por Caddy
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [acopio]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACOPIO_DOMAIN: ${ACOPIO_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Si el servidor ya tiene otro proxy en los puertos 80/443 (por ejemplo el de Nextcloud),
    # quita este servicio y apunta ese proxy a http://127.0.0.1:3000 (ver deploy/SERVIDOR.md)

volumes:
  caddy_data:
  caddy_config:
